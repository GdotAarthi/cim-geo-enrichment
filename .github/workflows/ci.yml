name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/

      - name: Run unit tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Validate sample CIM
        run: |
          python - <<'EOF'
          import sys
          sys.path.append('src')
          from parser.cim_extractor import extract_substations
          df = extract_substations('data/raw/sample_cim.xml')
          assert len(df) > 0, 'No substations extracted'
          print(f'OK - {len(df)} substations found')
          EOF

      - name: Lint with ruff
        shell: bash
        run: |
          pip install ruff
          ruff check src/ tests/